<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Algorithms Visualizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0f14;
      color: #dde3f4;
      font-family: 'Courier New', monospace;
      display: grid;
      grid-template-columns: 1fr 300px;
      grid-template-rows: 48px 1fr;
      height: 100vh;
    }

    .topbar {
      grid-column: 1 / -1;
      background: #13161f;
      border-bottom: 1px solid #1f2333;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 14px;
    }
    .topbar h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f97316;
      text-transform: uppercase;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #566080;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.connected { background: #4ade80; }
    .status-dot.planning  { background: #f97316; animation: blink 0.6s infinite; }
    #status-text { font-size: 11px; color: #566080; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .canvas-wrap {
      background: #0b0d12;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: crosshair;
      border: 1px solid #1f2333;
    }

    .panel {
      background: #13161f;
      border-left: 1px solid #1f2333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .panel-section h3 {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #566080;
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid #1f2333;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #1f2333;
      border-radius: 4px;
      background: #1a1e28;
      color: #dde3f4;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      margin-bottom: 6px;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:hover { border-color: #f97316; color: #f97316; }

    #log {
      background: #0b0d12;
      border: 1px solid #1f2333;
      border-radius: 4px;
      padding: 8px;
      height: 160px;
      overflow-y: auto;
      font-size: 10px;
      line-height: 1.7;
    }
    #log .sent     { color: #38bdf8; }
    #log .received { color: #4ade80; }
    #log .system   { color: #f97316; }
    #log .error    { color: #f87171; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 4px 0;
      border-bottom: 1px solid #1a1e28;
      color: #566080;
    }
    .stat-row span:last-child { color: #dde3f4; font-weight: 600; }

    .instructions {
      font-size: 11px;
      color: #566080;
      line-height: 1.8;
    }
    .instructions b { color: #dde3f4; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Planning Algorithms Visualizer</h1>
  <div class="status-dot" id="status-dot"></div>
  <span id="status-text">disconnected</span>
</div>

<div class="canvas-wrap">
  <canvas id="canvas" width="700" height="700"></canvas>
</div>

<div class="panel">
  <div class="panel-section">
    <h3>Connection</h3>
    <button class="btn" onclick="wsConnect()">Connect</button>
    <button class="btn" onclick="wsDisconnect()">Disconnect</button>
  </div>

  <div class="panel-section">
    <h3>Controls</h3>
    <button class="btn" onclick="resetPoints()">Reset Start / Goal</button>
    <button class="btn" onclick="clearPath()">Clear Path</button>
  </div>

  <div class="panel-section">
    <h3>Algorithm</h3>
    <select id="algo-select" style="
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #1f2333;
      border-radius: 4px;
      background: #1a1e28;
      color: #dde3f4;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      cursor: pointer;
  ">
      <option value="bfs">BFS — Breadth First Search</option>
      <option value="dfs">DFS — Depth First Search</option>
    </select>
  </div>

  <div class="panel-section">
    <h3>Stats</h3>
    <div class="stat-row"><span>Path length</span><span id="stat-path">-</span></div>
    <div class="stat-row"><span>Start</span><span id="stat-start">-</span></div>
    <div class="stat-row"><span>Goal</span><span id="stat-goal">-</span></div>
  </div>

  <div class="panel-section">
    <h3>Message Log</h3>
    <div id="log"></div>
    <button class="btn" onclick="clearLog()" style="margin-top:6px">Clear log</button>
  </div>

  <div class="panel-section">
    <h3>How to use</h3>
    <div class="instructions">
      1. Click <b>Connect</b><br>
      2. Click a free cell for <b style="color:#4ade80">START</b><br>
      3. Click another cell for <b style="color:#f97316">GOAL</b><br>
      4. BFS runs automatically<br>
      5. Path shows in <b style="color:#38bdf8">blue</b>
    </div>
  </div>
</div>

<script>
  // ── WebSocket ─────────────────────────────────────────
  let ws = null;

  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const logEl      = document.getElementById('log');

  function setStatus(cls, text) {
    statusDot.className = 'status-dot ' + cls;
    statusText.textContent = text;
  }

  function addLog(msg, cls) {
    const d = document.createElement('div');
    d.className = cls;
    const t = new Date().toLocaleTimeString('en-US', {hour12: false});
    d.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function clearLog() { logEl.innerHTML = ''; }

  function wsConnect() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      addLog('Already connected', 'system');
      return;
    }
    addLog('Connecting...', 'system');
    ws = new WebSocket('ws://localhost:8080/ws');

    ws.onopen = () => {
      setStatus('connected', 'connected');
      addLog('Connected to C++ server', 'system');
    };
    ws.onclose = (e) => {
      setStatus('', 'disconnected');
      addLog('Disconnected (' + e.code + ')', 'error');
      ws = null;
    };
    ws.onerror = () => {
      setStatus('', 'error');
      addLog('Connection error - is server running?', 'error');
    };
    ws.onmessage = (event) => {
      let parsed;
      try { parsed = JSON.parse(event.data); }
      catch { addLog('(raw) ' + event.data, 'received'); return; }

      if (parsed.type === 'set_obstacles') {
        addLog('set_obstacles received (' + (parsed.cells ? parsed.cells.length : 0) + ' cells)', 'received');
      } else {
        addLog('← ' + JSON.stringify(parsed).substring(0, 100), 'received');
      }

      if (messageHandlers[parsed.type]) {
        messageHandlers[parsed.type](parsed);
      }
    };
  }

  function wsDisconnect() {
    if (ws) { ws.close(); ws = null; }
  }

  function wsSend(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      addLog('Not connected', 'error');
      return;
    }
    ws.send(JSON.stringify(obj));
    addLog('→ ' + JSON.stringify(obj).substring(0, 100), 'sent');
  }

  const messageHandlers = {};
</script>

<script>
  // ── Grid Canvas ───────────────────────────────────────
  const ROWS      = 100;
  const COLS      = 100;
  const CELL_SIZE = 7;

  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');

  let gridData  = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
  let pathCells = [];
  let startCell = null;
  let goalCell  = null;
  let clickMode = 'start';

  function toPixel(row, col) {
    return { px: col * CELL_SIZE, py: row * CELL_SIZE };
  }

  function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = toPixel(r, c);

        if (startCell && r === startCell.row && c === startCell.col) {
          ctx.fillStyle = '#4ade80';
        } else if (goalCell && r === goalCell.row && c === goalCell.col) {
          ctx.fillStyle = '#f97316';
        } else if (pathCells.some(function(p) { return p.row === r && p.col === c; })) {
          ctx.fillStyle = '#38bdf8';
        } else if (gridData[r][c] === 1) {
          ctx.fillStyle = '#2a3550';
        } else {
          ctx.fillStyle = '#0e1018';
        }

        ctx.fillRect(p.px, p.py, CELL_SIZE, CELL_SIZE);
      }
    }

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * CELL_SIZE);
      ctx.lineTo(COLS * CELL_SIZE, r * CELL_SIZE);
      ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * CELL_SIZE, 0);
      ctx.lineTo(c * CELL_SIZE, ROWS * CELL_SIZE);
      ctx.stroke();
    }
  }

  canvas.addEventListener('click', function(e) {
    const rect   = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (e.clientX - rect.left) * scaleX;
    const py = (e.clientY - rect.top)  * scaleY;

    const col = Math.floor(px / CELL_SIZE);
    const row = Math.floor(py / CELL_SIZE);

    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
    if (gridData[row][col] === 1) return;

    if (clickMode === 'start') {
      startCell = { row: row, col: col };
      clickMode = 'goal';
      document.getElementById('stat-start').textContent = '(' + row + ', ' + col + ')';
      setStatus('connected', 'start set - now click goal');
    } else {
      goalCell  = { row: row, col: col };
      clickMode = 'start';
      document.getElementById('stat-goal').textContent = '(' + row + ', ' + col + ')';
      setStatus('planning', 'planning...');
      wsSend({
        type:      'plan',
        algorithm: document.getElementById('algo-select').value,
        start:     startCell,
        goal:      goalCell
      });
    }

    redraw();
  });

  messageHandlers['set_obstacles'] = function(msg) {
    gridData = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
    for (var i = 0; i < msg.cells.length; i++) {
      gridData[msg.cells[i].row][msg.cells[i].col] = 1;
    }
    redraw();
  };

  messageHandlers['path_update'] = function(msg) {
    pathCells = msg.path;
    document.getElementById('stat-path').textContent = msg.path.length + ' cells';
    setStatus('connected', 'path found');
    redraw();
  };

  messageHandlers['error'] = function(msg) {
    setStatus('connected', 'no path found');
    addLog('No path: ' + msg.message, 'error');
  };

  messageHandlers['connected'] = function(msg) {
    addLog('Server: ' + msg.message, 'system');
  };

  function resetPoints() {
    startCell = null;
    goalCell  = null;
    pathCells = [];
    clickMode = 'start';
    document.getElementById('stat-start').textContent = '-';
    document.getElementById('stat-goal').textContent  = '-';
    document.getElementById('stat-path').textContent  = '-';
    setStatus('connected', 'click canvas to place start');
    redraw();
  }

  function clearPath() {
    pathCells = [];
    document.getElementById('stat-path').textContent = '-';
    redraw();
  }

  redraw();
</script>

</body>
</html>
